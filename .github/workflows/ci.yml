# Kapex Cortex CI: the core tests on macOS, Linux and Windows on every push, and on a version tag
# (v1.2.3) single-file binaries for each OS attached to a GitHub release, so people without Node can run it.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # the release job attaches binaries

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          CORTEX_NO_NOTIFY: "1"

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # linux-x64
          - os: ubuntu-24.04-arm   # linux-arm64
          - os: macos-latest       # darwin-arm64
          - os: windows-latest     # win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
      - run: npm run build:sea
      - name: Compress
        shell: bash
        run: |
          cd dist
          f=$(ls cortex-* | grep -v '\.gz$' | head -1)
          gzip -9 -c "$f" > "$f.gz"
          sha256sum "$f.gz" > "$f.gz.sha256" 2>/dev/null || shasum -a 256 "$f.gz" > "$f.gz.sha256"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Single-file Cortex binaries (no Node needed). See BUILD-LOG.md." 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" dist/cortex-*.gz dist/cortex-*.sha256 --clobber
